# Fast pull-request checks.
#
# This validates Forge itself. It is distinct from the pipelines Forge *runs* for
# application repositories, which execute inside the platform's own workers — see
# docs/architecture.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same ref: only the latest commit matters.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  python-quality:
    name: Lint & type-check (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check apps packages tests scripts
      - name: Ruff format
        run: ruff format --check apps packages tests scripts
      - name: mypy (strict)
        run: |
          # shellcheck source=/dev/null
          source scripts/env.sh
          mypy apps packages

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge-ci-password
          POSTGRES_DB: forge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge -d forge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Integration tests run against the real PostgreSQL service above, not an
      # embedded server: the queue's SKIP LOCKED semantics are the thing under test.
      FORGE_TEST_DATABASE_URL: postgresql+asyncpg://forge:forge-ci-password@localhost:5432/forge_test
      FORGE_REDIS_URL: redis://localhost:6379/0
      FORGE_ENVIRONMENT: test
      FORGE_SECRET_KEY: ci-only-secret-key-at-least-32-characters
      FORGE_ALLOW_UNSANDBOXED_BUILDS: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Unit tests
        run: pytest tests/unit apps/sample-service/tests -q
      - name: Integration tests
        run: pytest tests/integration -q
      - name: Reliability tests
        run: pytest tests/reliability -q

  migrations:
    name: Migrations apply to an empty database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge-ci-password
          POSTGRES_DB: forge_migrations
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge -d forge_migrations"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FORGE_DATABASE_URL: postgresql+asyncpg://forge:forge-ci-password@localhost:5432/forge_migrations
      FORGE_ENVIRONMENT: test
      FORGE_SECRET_KEY: ci-only-secret-key-at-least-32-characters
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Upgrade from empty
        run: |
          source scripts/env.sh
          cd packages/forge-core && alembic upgrade head
      - name: Downgrade to base and back up again
        run: |
          source scripts/env.sh
          cd packages/forge-core
          alembic downgrade base
          alembic upgrade head
      - name: Autogenerate must produce no changes
        run: |
          # A non-empty autogenerate means the models and migrations have drifted.
          source scripts/env.sh
          cd packages/forge-core
          alembic revision --autogenerate -m "drift-check" --rev-id drift_check
          if grep -qE '^\s+op\.(create|drop|add|alter)' alembic/versions/drift_check_*.py; then
            echo "::error::Models and migrations have drifted. Generate a migration."
            cat alembic/versions/drift_check_*.py
            exit 1
          fi
          rm -f alembic/versions/drift_check_*.py

  web-quality:
    name: Lint, type-check, test & build (web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    name: Dependency & secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # gitleaks needs history to scan commits, not just the tree.
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit --requirement requirements-dev.txt --strict
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Node dependency audit
        working-directory: apps/web
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    name: Terraform format & validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.3"
      - name: Format check
        # -diff so a failure prints exactly what to change. Without it the step
        # only exits 3 and names nothing, which is useless when the toolchain
        # that produces the canonical formatting is not available locally.
        run: terraform -chdir=infra/terraform fmt -check -recursive -diff
      - name: Validate
        # -backend=false: validation needs no remote state and no credentials.
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate
