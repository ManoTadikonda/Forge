# Release: build versioned images, generate an SBOM, attach provenance and publish.
#
# Publishing happens only from a tag on the default branch and only after CI has
# passed. Pull requests from forks never reach this workflow, so untrusted code
# never gets access to registry credentials.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. v0.2.0)"
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Re-run required checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Build and publish images
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A protected environment adds a human approval gate before anything is
    # published or deployed.
    environment: release
    permissions:
      contents: read
      packages: write
      # Required for keyless signing and provenance attestation.
      id-token: write
      attestations: write
    strategy:
      matrix:
        component: [api, router, web]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          file: infra/compose/Dockerfile.${{ matrix.component }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.component }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/${{ matrix.component }}:latest
          # SLSA provenance and an SBOM attached to the image itself.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@7668571508540a607bdfd90a87a560489fe372eb # v2.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Scan the published image
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload scan results
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: trivy-${{ matrix.component }}
          path: trivy-${{ matrix.component }}.sarif
          retention-days: 30

  deploy:
    name: Deploy to AWS
    needs: publish
    runs-on: ubuntu-latest
    # A separate protected environment: publishing an image and deploying it are
    # different decisions and get different approvals.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Deployment is not configured
        run: |
          echo "::notice::No AWS deployment target is configured for this repository."
          echo "The Terraform stack in infra/terraform has never been applied; see"
          echo "docs/deployment.md. Configure the deployment role and remove this"
          echo "step before enabling automatic deploys."
          exit 0
