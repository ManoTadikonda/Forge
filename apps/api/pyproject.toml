[project]
name = "forge-api"
version = "0.1.0"
description = "Forge control-plane API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "forge-core",
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.32,<0.40",
    "python-multipart>=0.0.12,<0.1",
    "prometheus-client>=0.21,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forge_api*"]
