[project]
name = "forge-worker"
version = "0.1.0"
description = "Forge pipeline and deployment workers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "forge-core",
    "httpx>=0.27,<0.29",
    "dulwich>=0.22,<2",
    "psutil>=6.1,<8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forge_worker*"]
